name: Deploy Caelus (Fluxer)
on:
  push:
    branches:
      - main
    paths:
      - apps/caelus/fluxer/**/*
      # Ensure a shard eruption change triggers this workflow.
      - packages/utility/source/shard-eruption.ts
  workflow_dispatch:
concurrency:
  group: deploy-caelus-fluxer
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0.

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0.
        with:
          context: .
          file: apps/caelus/fluxer/Dockerfile
          tags: &image-tag thatskyapplication-caelus-fluxer:latest
          load: true
          platforms: linux/amd64
          cache-from: type=gha,scope=deploy-thatskyapplication-caelus-fluxer
          cache-to: type=gha,mode=max,scope=deploy-thatskyapplication-caelus-fluxer
          build-args: SENTRY_RELEASE=${{ github.sha }}
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false

      - name: Deploy via Uncloud
        uses: thatskyapplication/uncloud-action@898b95231b74d735a044b9aaea91eb321419b5d9 # v1.2.3.
        with:
          image-tag: *image-tag
          compose-files: compose.yaml
          uncloud-profile: thatskyapplication-caelus-fluxer
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_SERVER }}
          server-user: ${{ secrets.SERVER_USER }}
          server-host: ${{ secrets.SERVER_IP }}
          recreate: true
        env:
          FLUXER_TOKEN: ${{ secrets.FLUXER_TOKEN }}
