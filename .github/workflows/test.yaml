name: Test
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1.

      - name: Install pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0.
        with:
          install: false

      - name: Install dependencies
        run: pnpm install

      - name: Build dependencies
        run: pnpm run build

      - name: Check code quality
        run: pnpm run lint:ci

      - name: Validate TypeScript
        run: pnpm run test

      - name: Run Knip
        run: pnpm run knip
  typographical-errors:
    name: Typographical errors
    runs-on: ubuntu-latest
    steps:
      - *checkout

      - name: Scan for typographical errors
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0.
