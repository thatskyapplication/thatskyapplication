name: Deploy games
on:
  push:
    branches:
      - main
    paths:
      - apps/games/**/*
      - packages/utility/**/*
      - "!**/__tests__/**"
  workflow_dispatch:
concurrency:
  group: deploy-games
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0.

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0.
        with:
          context: .
          file: apps/games/Dockerfile
          tags: &image-tag thatskyapplication-games:latest
          load: true
          platforms: linux/amd64
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
            SENTRY_DATA_SOURCE_NAME=${{ secrets.SENTRY_DATA_SOURCE_NAME_GAMES }}
          secrets: sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=deploy-thatskyapplication-games
          cache-to: type=gha,mode=max,scope=deploy-thatskyapplication-games
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false

      - name: Deploy via Uncloud
        uses: thatskyapplication/uncloud-action@898b95231b74d735a044b9aaea91eb321419b5d9 # v1.2.3.
        with:
          image-tag: *image-tag
          compose-files: compose.yaml
          uncloud-profile: thatskyapplication-games
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_SERVER }}
          server-user: ${{ secrets.SERVER_USER }}
          server-host: ${{ secrets.SERVER_IP }}
          recreate: true
        env:
          SESSION_SECRET_GAMES: ${{ secrets.SESSION_SECRET_GAMES }}
          DATABASE_URL_CAELUS: postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@${{ secrets.POSTGRES_HOST }}:5432/${{ secrets.POSTGRES_DB_CAELUS }}
          APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_TOKEN_CAELUS: ${{ secrets.DISCORD_TOKEN }}
          REDIRECT_URI_LOGIN_GAMES: ${{ vars.REDIRECT_URI_LOGIN_GAMES }}
          CDN_URL: ${{ vars.CDN_URL }}
          SENTRY_DATA_SOURCE_NAME_GAMES: ${{ secrets.SENTRY_DATA_SOURCE_NAME_GAMES }}
