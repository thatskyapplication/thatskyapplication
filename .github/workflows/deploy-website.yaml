name: Deploy website
on:
  push:
    branches:
      - main
    paths:
      - apps/website/**/*
      - packages/sky-links/**/*
      - packages/utility/**/*
  workflow_dispatch:
concurrency:
  group: deploy-website
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0.

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0.
        with:
          context: .
          file: apps/website/Dockerfile
          tags: &image-tag thatskyapplication-website:latest
          load: true
          platforms: linux/amd64
          cache-from: type=gha,scope=deploy-thatskyapplication-website
          cache-to: type=gha,mode=max,scope=deploy-thatskyapplication-website
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
            SENTRY_DATA_SOURCE_NAME=${{ secrets.SENTRY_DATA_SOURCE_NAME_WEBSITE }}
          secrets: sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false

      - name: Deploy via Uncloud
        uses: thatskyapplication/uncloud-action@898b95231b74d735a044b9aaea91eb321419b5d9 # v1.2.3.
        with:
          image-tag: *image-tag
          compose-files: compose.yaml
          uncloud-profile: thatskyapplication-website
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_SERVER }}
          server-user: ${{ secrets.SERVER_USER }}
          server-host: ${{ secrets.SERVER_IP }}
          recreate: true
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          DATABASE_URL_CAELUS: postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@${{ secrets.POSTGRES_HOST }}:5432/${{ secrets.POSTGRES_DB_CAELUS }}
          DISCORD_TOKEN_CAELUS: ${{ secrets.DISCORD_TOKEN }}
          INTERNAL_URL_CAELUS: ${{ secrets.INTERNAL_URL_CAELUS }}
          APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          SUPPORT_SERVER_GUILD_ID: ${{ vars.SUPPORT_SERVER_GUILD_ID }}
          DEVELOPER_ROLE_ID: ${{ vars.DEVELOPER_ROLE_ID }}
          TRANSLATOR_ROLE_ID: ${{ vars.TRANSLATOR_ROLE_ID }}
          CROWDIN_CLIENT_ID: ${{ secrets.CROWDIN_CLIENT_ID }}
          CROWDIN_CLIENT_SECRET: ${{ secrets.CROWDIN_CLIENT_SECRET }}
          REDIRECT_URI_LOGIN: ${{ vars.REDIRECT_URI_LOGIN }}
          REDIRECT_URI_DISCORD_CROWDIN: ${{ vars.REDIRECT_URI_DISCORD_CROWDIN }}
          CDN_URL: ${{ vars.CDN_URL }}
          S3_ACCESS_KEY_ID_CAELUS_WEBSITE: ${{ secrets.S3_ACCESS_KEY_ID_CAELUS_WEBSITE }}
          S3_ACCOUNT_ID: ${{ secrets.S3_ACCOUNT_ID }}
          S3_SECRET_ACCESS_KEY_CAELUS_WEBSITE: ${{ secrets.S3_SECRET_ACCESS_KEY_CAELUS_WEBSITE }}
          SENTRY_DATA_SOURCE_NAME_WEBSITE: ${{ secrets.SENTRY_DATA_SOURCE_NAME_WEBSITE }}
