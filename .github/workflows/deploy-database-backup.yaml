name: Deploy database backup
on:
  push:
    branches:
      - main
    paths:
      - database-backup.sh
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0.

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0.
        with:
          context: .
          file: Dockerfile.backup
          tags: &image-tag database-backup:latest
          load: true
          platforms: linux/amd64
          cache-from: type=gha,scope=deploy-database-backup
          cache-to: type=gha,mode=max,scope=deploy-database-backup
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false

      - name: Deploy via Uncloud
        uses: thatskyapplication/uncloud-action@898b95231b74d735a044b9aaea91eb321419b5d9 # v1.2.3.
        with:
          image-tag: *image-tag
          compose-files: compose.yaml
          uncloud-profile: database-backup
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_SERVER }}
          server-user: ${{ secrets.SERVER_USER }}
          server-host: ${{ secrets.SERVER_IP }}
          recreate: true
        env:
          S3_ACCESS_KEY_ID_DATABASE_BACKUP: ${{ secrets.S3_ACCESS_KEY_ID_DATABASE_BACKUP }}
          S3_SECRET_ACCESS_KEY_DATABASE_BACKUP: ${{ secrets.S3_SECRET_ACCESS_KEY_DATABASE_BACKUP }}
          S3_ENDPOINT: https://${{ secrets.S3_ACCOUNT_ID }}.r2.cloudflarestorage.com
          S3_DEFAULT_REGION: ${{ secrets.S3_DEFAULT_REGION }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB_CAELUS: ${{ secrets.POSTGRES_DB_CAELUS }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          SENTRY_CRONS_DATABASE_BACKUP: ${{ secrets.SENTRY_CRONS_DATABASE_BACKUP }}
