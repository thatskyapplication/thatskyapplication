packages:
  - "apps/*"
  - "apps/caelus/*"
  - "packages/*"
catalog:
  "@aws-sdk/client-s3": ^3.1061.0
  "@discordjs/collection": ^2.1.1
  "@discordjs/core": dev
  "@discordjs/rest": dev
  "@discordjs/ws": dev
  "@hono/node-server": ^2.0.12
  "@sentry/node": ^10.69.0
  "@typescript/native": "npm:typescript@^7.0.2"
  "@types/node": ^26.1.1
  "@types/pg": ^8.20.0
  croner: ^9.1.0
  discord-api-types: ^0.38.50
  hono: ^4.12.32
  i18next: ^26.3.6
  kysely: ^0.28.17
  oxfmt: 0.62.0
  oxlint: 1.77.0
  oxlint-tsgolint: 7.0.2001
  pg: ^8.23.0
  pino: ^10.3.0
  pino-pretty: ^13.1.3
  sharp: ^0.35.3
  tsx: ^4.22.4
  typescript: ^7.0.2
  vite: ^8.2.0
  zod: ^4.4.3
catalogs:
  typescript6:
    typescript: "npm:@typescript/typescript6@^6.0.2"
catalogMode: strict
cleanupUnusedCatalogs: true
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build
allowBuilds:
  "@sentry/cli": true
  esbuild: true
  protobufjs: true
  sharp: true
peerDependencyRules:
  allowedVersions:
    "@hono/node-ws@1.3.1>@hono/node-server": ^2.0.6
minimumReleaseAgeExclude:
  - "@discordjs/collection"
  - "@discordjs/core"
  - "@discordjs/rest"
  - "@discordjs/util"
  - "@discordjs/ws"
  - "@types/node@26.1.1"
