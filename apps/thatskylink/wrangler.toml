#:schema node_modules/wrangler/config-schema.json
name = "thatskylink"
main = "source/index.ts"
compatibility_date = "2026-08-15"
workers_dev = false
routes = [{ pattern = "thatsky.link", custom_domain = true }]
upload_source_maps = true

[secrets]
required = ["SENTRY_DATA_SOURCE_NAME"]

[observability]
enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"
